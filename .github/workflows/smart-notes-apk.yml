name: Smart Notes APK

on:
  push:
    branches: [ccr-7574c869-5qdjm7]
    paths:
      - "smart-notes-android/**"
      - ".github/workflows/smart-notes-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-notes-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: smart-notes-debug-apk
          path: smart-notes-android/app/build/outputs/apk/debug/app-debug.apk

      # Also commit the APK to the branch so it can be downloaded without opening Actions.
      - name: Commit APK
        run: |
          mkdir -p ../apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/smart-notes-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../apk/smart-notes-debug.apk
          git commit -m "Build Smart Notes debug APK [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
