name: Smart Notes device test

on:
  push:
    branches: [ccr-7574c869-5qdjm7]
    paths:
      - "smart-notes-android/**"
      - ".github/workflows/smart-notes-device-test.yml"
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: smart-notes-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: smart-notes-android
          script: bash ../.github/scripts/smart-notes-device-test.sh

      - name: Summary
        if: always()
        run: |
          echo "### Instrumentation" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 device-out/instrument.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "### Crashes" >> "$GITHUB_STEP_SUMMARY"
          cat device-out/crash.txt >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: smart-notes-android/device-out
