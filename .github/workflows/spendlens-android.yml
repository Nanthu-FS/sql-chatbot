name: SpendLens Android

on:
  push:
    paths:
      - "spendlens/**"
      - ".github/workflows/spendlens-android.yml"
  pull_request:
    paths:
      - "spendlens/**"
      - ".github/workflows/spendlens-android.yml"
  workflow_dispatch:

concurrency:
  group: spendlens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spendlens
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue recordRoborazziDebug assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Summarise errors
        if: failure()
        run: |
          echo "::group::Compiler errors"
          grep -E "^e: |^w: .*(unresolved|Unresolved)" build.log | head -120 || true
          echo "::endgroup::"
          echo "::group::Test failures"
          grep -E -A40 " > .* FAILED$" build.log | grep -v -E "^\s+at (org\.junit|org\.robolectric\.internal|java\.base|jdk\.internal|org\.gradle|worker\.org|kotlin\.coroutines|kotlinx\.coroutines)" | head -300 || true
          echo "::endgroup::"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpendLens-apk
          path: |
            spendlens/app/build/outputs/apk/release/*.apk
            spendlens/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: spendlens/app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Commit UI screenshots for review
        if: always() && github.event_name == 'push'
        working-directory: .
        run: |
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          cp spendlens/app/build/outputs/roborazzi/*.png docs/screenshots/ 2>/dev/null || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update SpendLens UI screenshots [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: spendlens/app/build/reports/tests/
