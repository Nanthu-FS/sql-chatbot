name: SpendLens Android

on:
  push:
    paths:
      - "spendlens/**"
      - ".github/workflows/spendlens-android.yml"
  pull_request:
    paths:
      - "spendlens/**"
      - ".github/workflows/spendlens-android.yml"
  workflow_dispatch:

concurrency:
  group: spendlens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spendlens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APKs
        run: ./gradlew --no-daemon --stacktrace --continue testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpendLens-apk
          path: |
            spendlens/app/build/outputs/apk/release/*.apk
            spendlens/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: spendlens/app/build/reports/tests/
