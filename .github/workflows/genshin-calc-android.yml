name: Genshin Damage Calc

on:
  push:
    branches: [ccr-9d3a6849-adde0d]
    paths:
      - "genshin-calc-android/**"
      - ".github/workflows/genshin-calc-android.yml"
      - ".github/scripts/genshin-calc-device-test.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genshin-calc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: genshin-calc-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APKs
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Unit test summary
        if: always()
        run: |
          mkdir -p device-out
          python3 - <<'PY' | tee device-out/unit-tests.txt >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          total = failed = 0
          lines = []
          for f in sorted(glob.glob("core/build/test-results/test/*.xml")):
              s = open(f).read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', s)
              t, sk, fa, er = map(int, m.groups())
              total += t; failed += fa + er
              lines.append(f"- {f.split('TEST-')[-1][:-4]}: {t} tests, {fa + er} failed")
              for c in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  lines.append(f"  - FAILED {c.group(1)}: {c.group(2)[:300]}")
          print(f"### Core unit tests: {total} run, {failed} failed")
          print("\n".join(lines))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: genshin-damage-calc-debug-apk
          path: genshin-calc-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: genshin-calc-android
          script: bash ../.github/scripts/genshin-calc-device-test.sh

      - name: Device test summary
        if: always()
        run: |
          echo "### Instrumentation" >> "$GITHUB_STEP_SUMMARY"
          grep -E "INSTRUMENTATION_STATUS: (class|test)=|INSTRUMENTATION_STATUS_CODE|INSTRUMENTATION_CODE|Tests run|^OK|FAILURES" device-out/instrument.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "### Crashes" >> "$GITHUB_STEP_SUMMARY"
          head -n 60 device-out/crash.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit APK and device report
        # Failed runs still publish their report; cancelled (superseded) runs do not.
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          mkdir -p genshin-calc-android/apk
          cp genshin-calc-android/app/build/outputs/apk/debug/app-debug.apk genshin-calc-android/apk/genshin-damage-calc-debug.apk || true
          rm -rf genshin-calc-android/device-report && mkdir -p genshin-calc-android/device-report
          cp -r genshin-calc-android/device-out/. genshin-calc-android/device-report/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genshin-calc-android/apk genshin-calc-android/device-report
          git commit -m "Genshin calc: debug APK and device test report [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
