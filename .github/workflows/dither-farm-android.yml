name: Dither Farm APK

on:
  push:
    paths:
      - "farm-game/**"
      - ".github/workflows/dither-farm-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farm-game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dither-farm-debug-apk
          path: farm-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
