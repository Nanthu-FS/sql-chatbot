name: Urban Lens Android

on:
  push:
    paths:
      - 'urban-lens/**'
      - '.github/workflows/urban-lens-android.yml'
  workflow_dispatch:

concurrency:
  group: urban-lens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: urban-lens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: urban-lens-apks
          path: |
            urban-lens/app/build/outputs/apk/debug/*.apk
            urban-lens/app/build/outputs/apk/release/*.apk

      # A rolling pre-release gives the APKs a stable, public download link.
      - name: Publish APKs as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="urban-lens-debug"
          cp app/build/outputs/apk/release/app-release.apk urban-lens.apk
          cp app/build/outputs/apk/debug/app-debug.apk urban-lens-debug.apk
          ls -la urban-lens.apk urban-lens-debug.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" urban-lens.apk urban-lens-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Urban Lens test build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Android 8.0+. urban-lens.apk: optimized, for phones (ARM). urban-lens-debug.apk: unoptimized, all CPUs incl. emulators. Both are signed with a debug key for sideloading."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urban-lens-test-reports
          path: urban-lens/**/build/reports/tests/

  # Calls the real Overpass, Open-Meteo and OSRM servers the app uses. Informational only:
  # free public servers can be busy, so this never blocks the APK.
  live-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: urban-lens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Call the public APIs
        env:
          LIVE_API_TESTS: "1"
        run: ./gradlew --no-daemon :core:test --tests 'com.urbanlens.core.LiveApiTest'
