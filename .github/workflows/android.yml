name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --continue :app:assembleRelease :app:assembleDebugAndroidTest 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Error summary
        if: failure()
        run: grep -hE "^e: |^w: \[ksp\]|error:|FAILED|Test.*FAILED|Exception" build.log test.log 2>/dev/null | grep -v "^\s*at " | head -300 || true

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MonoWorkspace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonoWorkspace-apk
          path: android/dist/MonoWorkspace.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests/

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/MonoWorkspace.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Mono Workspace APK (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_SHA}. Install MonoWorkspace.apk on your phone."
