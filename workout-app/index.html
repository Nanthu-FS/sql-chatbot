<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Log daily workouts, sets and total weight lifted.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tonnage">
  <title>Tonnage Workout Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking first paint; system fonts show until it arrives (or when offline). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- app:start -->
  <main id="app" class="app"></main>
  <button id="fab" class="fab" type="button" data-action="start-today" hidden></button>
  <div id="rest" class="rest" role="timer" hidden></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <noscript><p style="padding:24px;color:#fff">Tonnage needs JavaScript to run.</p></noscript>
  <!-- app:end -->
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
